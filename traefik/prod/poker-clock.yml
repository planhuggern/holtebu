# Legacy config retained until bootstrap.sh migrates the VPS symlink to holtebu.yml.
# Do not install this file as the active config after migration.

http:
  routers:
    poker-clock:
      rule: "Host(`espen.holtebu.eu`) && PathPrefix(`/pokerklokke`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: poker-clock-backend
      priority: 100

    holtebu-server:
      rule: "Host(`espen.holtebu.eu`) && PathPrefix(`/pokerklokke/api/`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: holtebu-server-backend
      middlewares:
        - strip-pokerklokke
      priority: 200

  services:
    poker-clock-backend:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"

    holtebu-server-backend:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8082"

  middlewares:
    strip-pokerklokke:
      stripPrefix:
        prefixes:
          - "/pokerklokke"
