# Eksempel på Traefik dynamic config for Holtebu Portal.
# bootstrap.sh genererer dette automatisk til /etc/traefik/dynamic/holtebu.yml.
# Denne filen er kun referanse/mal.

http:
  routers:
    holtebu-portal:
      rule: "Host(`example.com`) && PathPrefix(`/pokerklokke`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: holtebu-portal-backend
      middlewares:
        - strip-basepath-pokerclock

  services:
    holtebu-portal-backend:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"

  middlewares:
    strip-basepath-pokerclock:
      stripPrefix:
        prefixes:
          - "/pokerklokke"
